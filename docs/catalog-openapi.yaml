          $ref: '#/components/schemas/BiometricsSpec'
        waterResistance:
          $ref: '#/components/schemas/WaterResistanceSpec'
      description: >-
        27개 키가 항상 존재한다. 미확인 데이터는 키를 생략하지 않고 status:unknown, raw:null로 응답한다. releaseDate는 기기 기본 정보이며 여기에 중복
        저장하지 않는다.
    DeviceConfiguration:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - storageGb
        - ramGb
        - ramStatus
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 160
        storageGb:
          type: integer
          minimum: 1
        ramGb:
          type:
            - integer
            - 'null'
          minimum: 1
        ramStatus:
          type: string
          enum:
            - known
            - unknown
            - not_disclosed
      oneOf:
        - properties:
            ramStatus:
              const: known
            ramGb:
              type: integer
              minimum: 1
        - properties:
            ramStatus:
              enum:
                - unknown
                - not_disclosed
            ramGb:
              type: 'null'
      description: 해당 한국 모델에서 실제로 검증한 저장 용량/RAM 조합. RAM 미공개를 0GB로 표현하지 않는다.
    DeviceSource:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - title
        - checkedAt
        - isPrimary
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          pattern: ^https://
        title:
          type: string
          minLength: 1
          maxLength: 240
        checkedAt:
          type:
            - string
            - 'null'
          format: date-time
        isPrimary:
          type: boolean
      allOf:
        - if:
            properties:
              isPrimary:
                const: true
          then:
            properties:
              checkedAt:
                type: string
                format: date-time
      description: >-
        기기별 근거 자료. sources에는 isPrimary:true가 정확히 하나 있고, 공개 기기의 primary.checkedAt은 반드시 존재한다. 기타 출처의 checkedAt은
        null일 수 있다.
