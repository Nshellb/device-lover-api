        - aliases
        - modelNumbers
        - imageUrl
        - variant
        - configurations
        - sourceUrl
        - sources
        - specs
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: '#/components/schemas/DeviceSlug'
        category:
          type: string
          const: smartphone
        brand:
          type: string
          minLength: 1
          description: 브랜드 표시 이름. 현재 SAMSUNG 또는 APPLE이며 브랜드 추가 시 늘어날 수 있다.
          maxLength: 120
        brandSlug:
          $ref: '#/components/schemas/BrandSlug'
        name:
          type: string
          minLength: 1
          maxLength: 160
        releaseDate:
          type: string
          format: date
          description: 한국 출시일. 오늘은 Asia/Seoul 기준으로 계산한다.
        marketCode:
          type: string
          const: KR
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          uniqueItems: true
        modelNumbers:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          uniqueItems: true
        imageUrl:
          type:
            - string
            - 'null'
          format: uri
          description: 대표 이미지가 없으면 null이며 프론트가 대체 이미지를 표시한다.
          pattern: ^https://
        variant:
          type:
            - string
            - 'null'
          description: 기존 비교 헤더용 표시 라벨. 특정 선택 SKU, 기본 추천 조합, 전체 옵션 또는 재고를 뜻하지 않는다.
          minLength: 1
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/DeviceConfiguration'
          description: 검증된 실제 조합만 포함한다. 아직 확인한 조합이 없으면 빈 배열이다.
        sourceUrl:
          type: string
          format: uri
          description: sources의 isPrimary:true 항목 url과 동일한 편의 필드.
          pattern: ^https://
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSource'
          minItems: 1
        specs:
          $ref: '#/components/schemas/DeviceSpecs'
        updatedAt:
          type: string
          format: date-time
      description: 공개 검증을 통과한 한국 출시 모델. sourceId 참조, primary 출처의 개수와 sourceUrl 일치는 응답 생성 전에 검증한다.
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 10000
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      description: >-
        totalPages = ceil(total/pageSize). total=0이면 totalPages=0. 요청한 page가 마지막 페이지를 넘으면 items=[]이며 page는
        요청값을 유지한다.
    DeviceListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSummary'
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
    ComparisonPath:
      type: string
      pattern: ^/[a-z0-9]+(?:-[a-z0-9]+)*$
      description: 응답 devices 순서대로 slug를 -vs-로 연결한 프론트 경로. 한 기기는 /slug, 두 기기는 /slug-vs-slug, 세 기기는 /slug-vs-slug-vs-slug.
    ComparisonResponse:
      type: object
      additionalProperties: false
      required:
        - devices
        - canonicalPath
        - schemaVersion
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceDetail'
          minItems: 1
          maxItems: 3
        canonicalPath:
          $ref: '#/components/schemas/ComparisonPath'
        schemaVersion:
          type: integer
          const: 1
      description: 기기 순서는 identifiers 입력 순서이며 중복 모델은 없다. 일부 식별자가 실패하면 부분 응답 없이 전체 요청이 실패한다.
    HomeResponse:
      type: object
      additionalProperties: false
      required:
        - devices
        - canonicalPath
        - schemaVersion
        - asOf
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceDetail'
          maxItems: 2
        canonicalPath:
          anyOf:
            - $ref: '#/components/schemas/ComparisonPath'
            - type: 'null'
        schemaVersion:
          type: integer
          const: 1
        asOf:
          type: string
          format: date
          description: 요청에서 공개/출시 조건 평가에 사용한 Asia/Seoul 날짜.
      allOf:
        - if:
            properties:
              devices:
                maxItems: 0
          then:
            properties:
              canonicalPath:
                type: 'null'
          else:
            properties:
              canonicalPath:
                $ref: '#/components/schemas/ComparisonPath'
      description: 출시일 내림차순, slug 오름차순으로 고른 서로 다른 모델 최대 2개. 부족한 수만큼 0개 또는 1개를 응답하며, 0개일 때만 canonicalPath=null이다.
    CatalogBrand:
      type: object
      additionalProperties: false
      required:
        - slug
        - name
      properties:
        slug:
          $ref: '#/components/schemas/BrandSlug'
        name:
          type: string
          minLength: 1
          maxLength: 120
    SpecificationRow:
      type: object
      additionalProperties: false
      required:
        - key
        - label
      properties:
        key:
          $ref: '#/components/schemas/SpecificationRowKey'
        label:
          type: string
          minLength: 1
    SpecificationSection:
      type: object
      additionalProperties: false
      required:
        - key
        - title
        - description
        - rows
      properties:
        key:
          type: string
          enum:
            - basic
            - display
            - performance
            - camera
            - battery
            - connectivity
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SpecificationRow'
          minItems: 1
    CatalogSchemaResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - category
        - maxComparisonDevices
        - brands
        - sections
      properties:
        schemaVersion:
          type: integer
          const: 1
        category:
          type: string
          const: smartphone
        maxComparisonDevices:
          type: integer
          const: 3
        brands:
          type: array
          items:
            $ref: '#/components/schemas/CatalogBrand'
          uniqueItems: true
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SpecificationSection'
          minItems: 6
          maxItems: 6
      description: >-
        schemaVersion=1은 basic/display/performance/camera/battery/connectivity 순서의 6개 섹션, 총 33개 행을 유지한다. 섹션 간
        동일 spec key 재사용은 의도적이며 표시 순서를 배열로 전달한다. 브랜드 목록은 동일한 공개/검증/출시 조건을 만족하는 카탈로그 모델이 하나 이상 있는 브랜드만 포함한다.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - validation_error
                - not_found
                - internal_error
                - database_unavailable
            message:
              type: string
              minLength: 1
      description: 현재 API의 오류 포맷을 재사용한다. 내부 SQL, 스택, 출처 검증 세부내역은 공개하지 않는다.
    BrandSlug:
      allOf:
        - $ref: '#/components/schemas/Slug'
        - maxLength: 80
      description: 최대 80자의 브랜드 slug.
